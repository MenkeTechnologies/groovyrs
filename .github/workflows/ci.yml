name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Doc
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      # ubuntu-26.04 ships the backward-compatible zone names (America/Godthab,
      # EST5EDT, ...) in tzdata-legacy, not tzdata; the zone tests read them
      # from /usr/share/zoneinfo.
      - name: Install legacy tz names
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tzdata-legacy
      - name: Build
        run: cargo build --verbose
      - name: Test
        run: cargo test --verbose
